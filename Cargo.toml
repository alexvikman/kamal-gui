[workspace]
resolver = "3"
members = ["crates/kgui-core", "crates/kgui-cli", "app"]

# egui/wgpu are far too slow unoptimized; optimize dependencies even in dev
# builds while keeping our own crates quick to compile.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
