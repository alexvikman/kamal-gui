[package]
name = "kamal-gui"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/alexvikman/kamal-gui"

[[bin]]
name = "kamal-gui"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
eframe = "0.37.0"
egui = "0.37.0"
egui_extras = "0.37.0"
kgui-core = { path = "../crates/kgui-core" }
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
vt100 = "0.18.1"
winit = { version = "0.30", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21.2", default-features = false }
